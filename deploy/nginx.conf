server {
    listen 80;
    listen [::]:80;
    server_name sort.0xcjy.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/uma-sort/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://sort.0xcjy.top$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sort.0xcjy.top;
    ssl_certificate /etc/letsencrypt/live/sort.0xcjy.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sort.0xcjy.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/uma-sort/current;
    index index.html;
    access_log /var/log/nginx/uma-sort.access.log;
    error_log /var/log/nginx/uma-sort.error.log;
    gzip_static on;
    gzip_vary on;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/uma-sort/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
